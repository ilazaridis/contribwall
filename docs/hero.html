<!doctype html>
<!-- Source for docs/hero.png. Render at 2400x1200 with headless Chrome:
     chrome --headless --disable-gpu --screenshot=hero.png --window-size=2400,1200 \
            --virtual-time-budget=3000 docs/hero.html                               -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>contribwall</title>
<style>
  html, body { margin: 0; width: 2400px; height: 1200px; background: #000; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
  }
  #mark {
    position: absolute; top: 54px; left: 64px;
    font-size: 26px; font-weight: 700; letter-spacing: .42em;
    text-transform: uppercase; color: #3f6b46;
  }
  #hero { flex: 1; display: flex; align-items: center; justify-content: center; }
  #total {
    font-weight: 900; font-size: 560px;
    letter-spacing: -0.035em; line-height: 0.8;
  }
  #chart { position: relative; height: 430px; display: flex; align-items: stretch; padding: 0 64px; }
  #baseline { position: absolute; left: 64px; right: 64px; bottom: 54px; height: 1px; background: #242424; }
  .day { flex: 1; display: flex; flex-direction: column; }
  .track { position: relative; flex: 1; }
  .bar { position: absolute; bottom: 0; left: 16%; width: 68%; border-radius: 8px 8px 0 0; }
  .val {
    position: absolute; left: 0; width: 100%; text-align: center;
    font-size: 62px; font-weight: 800; letter-spacing: -0.02em;
  }
  .dow {
    height: 54px; line-height: 54px; text-align: center;
    font-size: 22px; font-weight: 600; color: #5a5a5a;
  }
</style>
</head>
<body>
<div id="mark">contribwall</div>
<div id="hero"><div id="total">3214</div></div>
<div id="chart"><div id="baseline"></div></div>
<script>
  var RAMP = ['#e8f58c', '#b7e06a', '#79c451', '#45a046', '#217a3c'];
  var DATA = [42, 18, 63, 87, 51, 24, 9, 76, 112, 58, 33, 95, 140, 71];
  var LABELS = ['M', 'T', 'W', 'T', 'F', 'S', 'S', 'M', 'T', 'W', 'T', 'F', 'S', 'S'];
  var chart = document.getElementById('chart');
  var max = Math.max.apply(null, DATA);

  DATA.forEach(function (count, i) {
    var share = count / max;
    var step = Math.min(RAMP.length - 1, Math.max(0, Math.ceil(share * RAMP.length) - 1));

    var day = document.createElement('div');
    day.className = 'day';
    var track = document.createElement('div');
    track.className = 'track';
    var val = document.createElement('div');
    val.className = 'val';
    val.textContent = count;
    val.style.bottom = 'calc(' + (share * 80) + '% + 12px)';
    var bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (share * 80) + '%';
    bar.style.backgroundColor = RAMP[step];
    var dow = document.createElement('div');
    dow.className = 'dow';
    dow.textContent = LABELS[i];

    track.appendChild(val);
    track.appendChild(bar);
    day.appendChild(track);
    day.appendChild(dow);
    chart.appendChild(day);
  });
</script>
</body>
</html>
